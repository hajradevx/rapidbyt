overrides:
  vite@*: "catalog:"
  "@nuxt/fonts": "1.1.0"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  vue-demi: true
  better-sqlite3: true
  sharp: true
  workerd: true
  unrs-resolver: set this to true or false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@napi-rs/wasm-runtime@1.2.6"
  - "@nuxt/icon@2.6.1"
  - hast-util-to-text@4.0.3
  - mdast-util-find-and-replace@3.0.4
  - unist-util-visit-parents@6.1.0
  - unist-util-visit@5.2.0
skills:
  dirs:
    - .claude/skills
permissions:
  "@nuxtjs/seo":
    skills: true
