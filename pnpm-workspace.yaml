overrides:
  vite@*: "catalog:"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  vue-demi: true
  better-sqlite3: true
  sharp: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@napi-rs/wasm-runtime@1.2.6"
  - "@nuxt/icon@2.6.1"
  - hast-util-to-text@4.0.3
  - mdast-util-find-and-replace@3.0.4
  - unist-util-visit-parents@6.1.0
  - unist-util-visit@5.2.0
  - "@voidzero-dev/vite-plus-core@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.6.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.6.0"
  - vite-plus@1.6.0
skills:
  dirs:
    - .claude/skills
permissions:
  "@nuxtjs/seo":
    skills: true
  unrs-resolver:
    build: true
