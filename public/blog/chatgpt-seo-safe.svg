<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="ng1">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="420" fill="url(#g1)"/>

  <!-- Noise overlay for texture -->
  <rect width="800" height="420" fill="white" opacity="0.03" filter="url(#ng1)"/>

  <!-- Decorative circles -->
  <circle cx="680" cy="-40" r="200" fill="white" opacity="0.06"/>
  <circle cx="720" cy="460" r="160" fill="white" opacity="0.04"/>
  <circle cx="-40" cy="200" r="140" fill="white" opacity="0.05"/>

  <!-- Grid dots pattern -->
  <pattern id="pg1" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="white" opacity="0.15"/>
  </pattern>
  <rect width="800" height="420" fill="url(#pg1)"/>

  <!-- Category badge -->
  <rect x="24" y="24" width="55" height="28" rx="14" fill="white" opacity="0.2"/>
  <text x="38" y="42" fill="white" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5" opacity="0.9">SEO</text>

  <!-- Icon (centered, large, subtle) -->
  <g transform="translate(368, 60)" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.25">
    <svg width="64" height="64" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
  </g>

  <!-- Title text -->
  <text x="200" y="131" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" letter-spacing="-0.3">Using ChatGPT for Website</text>
  <text x="200" y="165" text-anchor="middle" fill="white" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" letter-spacing="-0.3">Content — SEO Safe?</text>

  <!-- Bottom brand bar -->
  <rect x="0" y="384" width="800" height="36" fill="black" opacity="0.25"/>
  <text x="24" y="407" fill="white" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" opacity="0.8">rapidbyt.com</text>
  <text x="776" y="407" text-anchor="end" fill="white" font-family="system-ui,-apple-system,sans-serif" font-size="12" opacity="0.6">Web Performance &amp; SEO</text>
</svg>